name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.10"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run check

      - name: Create release and publish package
        run: npx --yes semantic-release@25.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
